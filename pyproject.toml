[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qed-proof"
version = "0.4.0"
description = "Python SDK for QED Proof: submit claims, fetch receipts, and verify them offline against the PoAW receipt spec."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nuraveda Lab" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
  "rfc8785==0.1.4",
  "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://docs.qedproof.site"
Documentation = "https://docs.qedproof.site"
Source = "https://github.com/Nuraveda/qed-proof-python"

[project.optional-dependencies]
anchor = [
  "eth-abi>=5",
  "eth-hash[pycryptodome]>=0.7",
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qed_proof"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
